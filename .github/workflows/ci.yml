name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q --cov=strapkit --cov-report=term --cov-fail-under=90

  checks:
    name: Type check, version, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build twine
      - run: mypy src/ --strict --ignore-missing-imports
      - name: Build and verify distributions
        run: |
          python -m build
          twine check dist/*
          python -m zipfile -l dist/*.whl | grep -q "strapkit/py.typed"
      - name: Check version consistency
        run: |
          python - <<'PY'
          import re
          import sys

          # (file, variable name) pairs that must all carry the same version.
          SOURCES = [
              ("pyproject.toml", "version"),
              ("setup.py", "version"),
              ("src/__init__.py", "__version__"),
          ]

          def read_version(path, key):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              match = re.search(rf"^\s*{key}\s*=\s*[\"']([^\"']+)[\"']", text, re.MULTILINE)
              if match is None:
                  sys.exit(f"ERROR: no `{key} = ...` found in {path}")
              return match.group(1)

          versions = {path: read_version(path, key) for path, key in SOURCES}
          for path, version in versions.items():
              print(f"{path:<16} {version}")

          if len(set(versions.values())) != 1:
              sys.exit("ERROR: version mismatch across files")
          print("Version consistency: OK")
          PY
