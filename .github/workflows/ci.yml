name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q
      - run: mypy src/ --ignore-missing-imports
      - name: Check version consistency
        run: |
          python - <<'PY'
          import re
          import sys

          # (file, variable name) pairs that must all carry the same version.
          SOURCES = [
              ("pyproject.toml", "version"),
              ("setup.py", "version"),
              ("src/__init__.py", "__version__"),
          ]

          def read_version(path, key):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              match = re.search(rf"^\s*{key}\s*=\s*[\"']([^\"']+)[\"']", text, re.MULTILINE)
              if match is None:
                  sys.exit(f"ERROR: no `{key} = ...` found in {path}")
              return match.group(1)

          versions = {path: read_version(path, key) for path, key in SOURCES}
          for path, version in versions.items():
              print(f"{path:<16} {version}")

          if len(set(versions.values())) != 1:
              sys.exit("ERROR: version mismatch across files")
          print("Version consistency: OK")
          PY
